<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="mb-3">
        <form th:action="@{/add}">
            <input type="hidden" name="_method" value="POST">
            <button type="submit" class="btn btn-primary" title="Add">
                <i class="fas fa-plus"></i> Add Todo
            </button>
        </form>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Title</th>
            <th scope="col">Description</th>
            <th scope="col">Completed</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="todo : ${todos}">
            <tr th:object="${todo}">
                <th scope="row" th:text="${todoStat.count}"></th>
                <td th:text="*{title}"></td>
                <td th:text="*{description}"></td>
                <td th:text="*{completed} ? '✅' : '🕐'"></td>
                <td>
                    <form th:action="@{/update/{id}(id=${todo.id})}" method="post">
                        <input type="hidden" name="_method" value="PUT">
                        <button type="submit" class="btn btn-sm btn-warning me-1" title="Update">
                            <i class="fas fa-edit"></i>
                        </button>
                    </form>
                    <form th:action="@{/todo/{id}(id=${todo.id})}" method="post">
                        <input type="hidden" name="_method" value="DELETE">
                        <button type="submit" class="btn btn-sm btn-danger me-1" title="Delete"
                                onclick="return confirm('Haqiqatdan o‘chirmoqchimisiz?')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>
                    <a th:href="@{/todo/{id}(id=${todo.id})}" class="btn btn-sm btn-info" title="Info">
                        <i class="fas fa-info-circle"></i>
                    </a>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>


    <!-- Todos Table -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
