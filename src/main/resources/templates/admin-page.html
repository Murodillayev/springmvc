<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Userlar ro‘yxati</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4 text-center">👥 Userlar ro‘yxati</h2>

  <div class="card shadow-sm rounded-4">
    <div class="card-body">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Username</th>
          <th scope="col">Roles</th>
          <th scope="col">Permissions</th>
        </tr>
        </thead>
        <tbody id="userTableBody">
        <!-- JS orqali to‘ldiriladi -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Test uchun 10 ta user
  const users = [
    { username: "user1", roles: ["USER"], permissions: ["READ"] },
    { username: "user2", roles: ["ADMIN"], permissions: ["READ", "WRITE"] },
    { username: "user3", roles: ["USER"], permissions: ["READ"] },
    { username: "user4", roles: ["ADMIN"], permissions: ["READ", "WRITE"] },
    { username: "user5", roles: ["USER"], permissions: ["READ"] },
    { username: "user6", roles: ["ADMIN"], permissions: ["READ", "WRITE"] },
    { username: "user7", roles: ["USER"], permissions: ["READ"] },
    { username: "user8", roles: ["ADMIN"], permissions: ["READ", "WRITE"] },
    { username: "user9", roles: ["USER"], permissions: ["READ"] },
    { username: "user10", roles: ["ADMIN"], permissions: ["READ", "WRITE"] }
  ];

  const tableBody = document.getElementById("userTableBody");

  users.forEach((user, index) => {
    const row = document.createElement("tr");

    row.innerHTML = `
            <td>${index + 1}</td>
            <td>${user.username}</td>
            <td>
                ${user.roles.map(role => {
      let color = role === "ADMIN" ? "danger" : "primary";
      return `<span class="badge bg-${color} me-1">${role}</span>`;
    }).join("")}
            </td>
            <td>
                ${user.permissions.map(perm =>
            `<span class="badge bg-success me-1">${perm}</span>`
    ).join("")}
            </td>
        `;

    tableBody.appendChild(row);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
