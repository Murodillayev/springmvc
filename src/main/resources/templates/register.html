<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<form class="row g-3" th:action="@{/register}" method="post" th:object="${dto}">
<!--    <input type="text" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->
    <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Full name</label>
        <input type="text" class="form-control" id="inputEmail4" th:field="${dto.fullName}">
    </div>
    <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Username</label>
        <input type="text" class="form-control" id="inputPassword4" th:field="*{username}">
    </div>
    <div class="col-12">
        <label for="inputAddress" class="form-label">Password</label>
        <input type="password" class="form-control" id="inputAddress" th:field="*{password}">
    </div>
    <div class="col-md-4">
        <label for="inputState" class="form-label">Role</label>
        <select id="inputState" class="form-select" th:field="*{roleId}">
            <option value="" selected>Choose...</option>
            <th:block th:each="role : ${roles}">
                <option th:value="${role.id}" th:text="${role.name}"></option>
            </th:block>
        </select>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-primary">Sign in</button>
    </div>
</form>


</body>
</html>
