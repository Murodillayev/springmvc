<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sahifasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .login-container {
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .error-alert {
      display: none;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<body>
<div class="login-container">
  <h2 class="text-center mb-4">Login</h2>
  <div th:text="${param.error}" id="errorAlert" class="alert alert-danger error-alert" role="alert">
    Foydalanuvchi nomi yoki parol noto'g'ri!
  </div>
  <form action="/login" method="post">
<!--    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>-->
    <div class="mb-3">
      <label for="username" class="form-label">Foydalanuvchi nomi</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Foydalanuvchi nomini kiriting" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Parol</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Parolni kiriting" required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
      <label class="form-check-label" for="rememberMe">Meni eslab qol</label>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-2">Kirish</button>
    <a href="/register" class="btn btn-link w-100 text-center">Ro'yxatdan o'tish</a>
  </form>
</div>


<script>
  function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const errorAlert = document.getElementById('errorAlert');

    // Oddiy validatsiya (haqiqiy loyihada server bilan tekshirish kerak)
    if (username === '' || password === '') {
      errorAlert.style.display = 'block';
      setTimeout(() => {
        errorAlert.style.display = 'none';
      }, 3000);
      return;
    }

    if (rememberMe) {
      localStorage.setItem('username', username);
    } else {
      localStorage.removeItem('username');
    }

    // Kirish logikasi (masalan, API chaqiruvi yoki boshqa sahifaga o'tish)
    alert('Kirish muvaffaqiyatli!'); // Bu faqat namuna uchun
  }

  // Sahifa yuklanganda saqlangan ma'lumotlarni tekshirish
  window.onload = function() {
    const savedUsername = localStorage.getItem('username');
    if (savedUsername) {
      document.getElementById('username').value = savedUsername;
      document.getElementById('rememberMe').checked = true;
    }
  }
</script>
</body>
</html>
